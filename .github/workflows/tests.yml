name: Application tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: election_test
          POSTGRES_USER: election
          POSTGRES_PASSWORD: ci-only-local-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U election -d election_test"
          --health-interval 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://election:ci-only-local-test@localhost:5432/election_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app
